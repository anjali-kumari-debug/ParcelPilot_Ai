# ParcelPilot AI Support - full stack.
#
#   docker compose up --build
#
# Chat defaults to Groq (set GROQ_API_KEY in a repo-root .env).
# Ollama still runs for embeddings / document search only (not the chat model
# unless you set LLM_PROVIDER=ollama).
#
# Services:
#   ollama   - embeddings runtime (nomic-embed-text); optional local chat
#   backend  - FastAPI agent API
#   frontend - React app served by nginx, proxies /api to the backend

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-llama3.1:8b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      # Default chat backend: groq (cloud). Use ollama for fully local chat.
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      # Free cloud LLM (Groq). Set GROQ_API_KEY in a repo-root .env.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-openai/gpt-oss-120b}
      DOC_DIR: /data/docs
      STATE_DIR: /data/state
    volumes:
      # Mount the given data pack read-only, and a writable state volume.
      - "./Doc Folder:/data/docs:ro"
      - backend_state:/data/state
      # TEMPORARY: debug-session logs to host file. Remove after debugging.
      - ./.cursor:/app/.cursor
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8090:80"

volumes:
  ollama_models:
  backend_state:
