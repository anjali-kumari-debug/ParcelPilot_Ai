# ParcelPilot AI Support - local stack.
#
# Default (no Ollama):
#   docker compose up --build
#
# Optional local Ollama chat:
#   ENABLE_OLLAMA=true LLM_PROVIDER=ollama docker compose --profile ollama up --build

services:
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      ENABLE_OLLAMA: ${ENABLE_OLLAMA:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-fastembed}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      CHAT_MODEL: ${CHAT_MODEL:-llama3.1:8b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-openai/gpt-oss-120b}
      DOC_DIR: /data/docs
      STATE_DIR: /data/state
    volumes:
      - "./Doc Folder:/data/docs:ro"
      - backend_state:/data/state
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8090:80"

volumes:
  ollama_models:
  backend_state:
